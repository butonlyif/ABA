limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=public_ai_limit:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # 上传头像最大 10MB，请求超时 120s
  client_max_body_size 10m;
  client_body_timeout 120s;

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /api/v1/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/v1/auth/login;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/chat/public {
    limit_req zone=public_ai_limit burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/v1/chat/public;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
