limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=public_ai_limit:10m rate=20r/m;
log_format performance '$remote_addr - $request_method $uri $status '
                       'request_time=$request_time upstream_time=$upstream_response_time '
                       'bytes=$body_bytes_sent request_id=$request_id';

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log performance;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/plain
    text/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # 上传头像最大 10MB，请求超时 120s
  client_max_body_size 10m;
  client_body_timeout 120s;

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location ~* ^/(?:assets|admin/assets)/.+\.(?:js|css|webp|svg|png|jpg|jpeg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /brand/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /ready {
    proxy_pass http://api:8000/ready;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api:8000/metrics;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/v1/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/v1/auth/login;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/chat/public {
    limit_req zone=public_ai_limit burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/v1/chat/public;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
