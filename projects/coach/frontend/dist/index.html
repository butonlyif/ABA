  <body>
    <div id="root"></div>
    <script>
      // One-time migration away from the legacy PWA worker. Do not erase caches
      // on every visit: that turns every mobile launch into a cold start.
      if ('serviceWorker' in navigator) {
        var migrationKey = 'aba_sw_cleanup_v1';
        if (!localStorage.getItem(migrationKey)) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }).then(function() {
            if (!window.caches) return;
            return caches.keys().then(function(keys) {
              return Promise.all(keys.filter(function(k) {
                return k.indexOf('workbox') !== -1 || k.indexOf('vite-pwa') !== -1;
              }).map(function(k) { return caches.delete(k); }));
            });
          }).finally(function() {
            localStorage.setItem(migrationKey, 'done');
          });
        }
      }
    </script>
